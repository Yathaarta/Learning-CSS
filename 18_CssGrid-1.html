<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            border: 2px solid black;
            display: grid;
            grid-template-columns: [pehla] 120px [doosra] 80px [antim];
            grid-template-rows: 120px  120px 120px;
        }
        .item {
            border: 2px solid red;
            height: 55px;
            width: 55px;
        }

        .item4 {
            grid-row: 1/2;  /* row-start gridline / row-end gridline  , if 2 rows then 3 gridlines */  
            grid-column: 1/2;    /* column-start / column-end */
        }
        .item1 {
            grid-row: 1/2;    /*short for grid-row-start: 1; grid-row-end: 2;*/
            grid-column: pehla/doosra;    /* can take names for grid lines as well */  
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item4">4</div>
        <div class="item">5</div>
    </div>
</body>
</html>
