<!--Every element in HTML is a rectangular box. The CSS box model describes the rectangular boxes that are generated for elements in the document tree and laid out according to the visual formatting model.-->

<!--Every box is composed of four areas: content, padding, border, and margin.-->

<!-- The content area contains the actual content of the box, such as text or images. The padding area is the space between the content and the border. The border area is the edge of the box, which can be styled with different widths and colors. The margin area is the space outside the border that separates the box from other elements.-->

<!-- see https://media.gcflearnfree.org/content/5ef2084faaf0ac46dc9c10be_06_23_2020/box_model.png -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css boxmodel</title>
    <style>
        /*Browser default styles may add margin and padding to elements. To ensure consistent styling, it's common to reset these values to zero.*/
        * {
            margin: 0;
            padding: 0;
            
        }
        .box {
            background-color: aqua;
        }
        .box1 {
            color:indigo;
            padding: 25px;
            margin: 10px;
            border: 2px solid black;


            height: 100px;
            /* total height of element = height + padding top + padding bottom + border top + border bottom + margin top + margin bottom = 100 + 25 + 25 + 2 + 2 + 10 + 10 = 174px */


            box-sizing: border-box;
            /*This ensures that padding and border are included in the element's total width and height, hence auto adjusting the content area accordingly. here total height is 100px, hence content area height = 100 - (25 + 25 + 2 + 2) = 46px */
        }
        .box2 {
            color: red;
            padding: 25px;
            margin: 10px;
            border: 2px solid black;
            height: 100px;
            box-sizing: border-box;

            /* Here we can see margin collapse in action. The vertical margins of box1 and box2 collapse into a single margin of 10px between them, rather than adding up to 20px. Hence total height of box2 = 100 + 25 + 25 + 2 + 2 + 10 = 164px */

            /* see https://www.scientecheasy.com/wp-content/uploads/2024/06/vertical-margin-collapse-in-css.png */
        }
    </style>
</head>

<body>
    <div class="box box1">I am box 1</div>
    <div class="box box2">I am box 2</div>
</body>
</html>
