<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #img1 {
            filter: blur(2px);
        }
        #img2 {
            filter: brightness(140%);
        }
        #img3 {
            filter: grayscale(50%);
        }
        #img4 {
            filter: contrast(150%)
        }
        #img5 {
            filter: sepia(50%);
        }
        #img6 {
            filter: invert(100%)
        }
        #img7 {
            filter: opacity(30%);
        }
    </style>
</head>
<body>
    <div class="container">
        <p>blur filter</p>
        <img id="img1" src="https://cdn.pixelbin.io/v2/dummy-cloudname/original/upscalemedia_assets/home_page/Individual_After.png?f_auto=true">
         <p>brightness filter</p>
        <img id="img2" src="https://cdn.pixelbin.io/v2/dummy-cloudname/original/upscalemedia_assets/home_page/Individual_After.png?f_auto=true">
        <p>grayscale filter</p>
        <img id="img3" src="https://cdn.pixelbin.io/v2/dummy-cloudname/original/upscalemedia_assets/home_page/Individual_After.png?f_auto=true">
        <p>contrast filter</p>
        <img id="img4" src="https://cdn.pixelbin.io/v2/dummy-cloudname/original/upscalemedia_assets/home_page/Individual_After.png?f_auto=true">
        <p>sepia filter</p>
        <img id="img5" src="https://cdn.pixelbin.io/v2/dummy-cloudname/original/upscalemedia_assets/home_page/Individual_After.png?f_auto=true">
        <p>invert filter</p>
        <img id="img6" src="https://cdn.pixelbin.io/v2/dummy-cloudname/original/upscalemedia_assets/home_page/Individual_After.png?f_auto=true">
        <p>opacity filter</p>
        <img id="img7" src="https://cdn.pixelbin.io/v2/dummy-cloudname/original/upscalemedia_assets/home_page/Individual_After.png?f_auto=true">
    </div>
</body>
</html>
