<!--Discussing alternate method of using css grids from gird-template areas-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            border: 2px solid black;
            display: grid;
            grid-template-areas:     /* simple way to define 3 rows and 3 columns */
                "nav nav nav"
                "side article article"
                "footer footer footer";
        }
        .item {
            border: 2px solid red;
            height: 55px;
        }
        .item1 {
           grid-area: nav; /* directly assign the area name to the item */ 
           background-color: salmon;
        }
        .item2 {
            grid-area: side;
            background-color: aqua;
        }
        .item3 {
            grid-area: article;
            background-color: beige;
        }
        .item4 {
            grid-area: footer;      /*will take whole row, cause whole row only has footer, anyother item with footer will overlap*/
            background-color: lightgreen;
        }
        .item5 {
            grid-area: nav;
        }
        

    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
        <div class="item item5">5</div>
    </div>
</body>
</html>
